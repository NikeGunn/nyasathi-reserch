  - slug_en: public-procurement-act-2063
    name_ne: "सार्वजनिक खरिद ऐन, २०६३"
    why: "Amended repeatedly; the product records 83 provisions on site."
  - slug_en: nepal-rastra-bank-act-2058
    name_ne: "नेपाल राष्ट्र बैङ्क ऐन, २०५८"
    why: "Central bank act, amended alongside BAFIA."
  - slug_en: bonus-act-2030
    name_ne: "बोनस ऐन, २०३०"
