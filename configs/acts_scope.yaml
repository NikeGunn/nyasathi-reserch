# NEPVERSA act scope — which Acts the corpus covers, and why.
#
# PAPER_PLAN.md §6 item 2 asks for 10-20 acts amended several times.
# Selection is ordered by AMENDMENT DENSITY, not by size: an act with no
# amendment footnotes contributes provisions but no T2/T3 items, which are
# the paper's whole point.
#
# Acts are harvested in BOTH editions where available. The Nepali edition is
# primary (the paper is about Nepali law); the English edition gives a free
# gloss for figures, which PAPER_PLAN.md §15.3 requires beside Devanagari.

source: nepallaws.com
retrieved_window: "2026-09-19 onwards"
acts_listed_on_site: 59   # 29 Nepali + 30 English, counted 2026-09-19

tier_1_confirmed:
  # Harvested and verified this session.
  - slug_en: banking-offence-and-punishment-act-2064
    slug_ne: "बैङ्किङ्ग-कसूर-तथा-सजाय-ऐन-२०६४"
    name_ne: "बैङ्किङ्ग कसूर तथा सजाय ऐन, २०६४"
    sections: 34
    amendment_density: "8/34 sections carry footnotes (24%)"
    lettered_sections: ["12A", "14A", "14B", "19B"]   # inserted by amendment
    why: >
      Measured 24% amendment density and four amendment-inserted sections.
      Also the product's best-resolved act (255/255 citations), so T4
      statute-to-case linkage is already possible here.
    status: harvested

