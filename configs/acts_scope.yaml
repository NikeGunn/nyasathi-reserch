  - slug_en: labour-act-2074
    name_ne: "श्रम ऐन, २०७४"
  - slug_en: cooperatives-act-2074
    name_ne: "सहकारी ऐन, २०७४"
  - slug_en: insurance-act-2079
    name_ne: "बीमा ऐन, २०७९"

# Selection rule, applied AFTER a density probe of each candidate:
#   keep an act when it has >= 3 amended units OR >= 1 lettered section.
# An act that fails both is harvested for T1/T5 only and is reported as such
# in the dataset table. Acts are never dropped silently: every probed act
# appears in the statistics with its measured density, including zeros.
selection_rule:
  min_amended_units: 3
  or_min_lettered_sections: 1
  note: >
    Report every probed act including the rejects. A scope chosen by an
    unreported filter is a scope nobody can reproduce.
